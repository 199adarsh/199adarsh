<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" font-family="'Courier New', Courier, monospace">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111722" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <!-- Clean Container -->
  <rect width="860" height="240" rx="10" fill="url(#cardBg)" />
  <rect x="0.5" y="0.5" width="859" height="239" rx="10" fill="none" stroke="#30363d" stroke-width="1" />

  <!-- Terminal Header -->
  <line x1="0" y1="32" x2="860" y2="32" stroke="#30363d" stroke-width="1" />
  <circle cx="20" cy="16" r="5" fill="#ff5f56" />
  <circle cx="36" cy="16" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="16" r="5" fill="#27c93f" />
  <text x="430.0" y="20" fill="#8b949e" font-size="12" text-anchor="middle">199adarsh@github: ~$ analytics --summary</text>

  <!-- Main Metrics Grid (Left Column) -->
  <g transform="translate(30, 60)">
    <text x="0" y="0" fill="#58a6ff" font-size="13" font-weight="700">&#8212; PERFORMANCE METRICS</text>

    <!-- Total Contributions -->
    <text x="0" y="32" fill="#ffa657" font-size="12.5" font-weight="700">Total Contributions</text>
    <text x="210" y="32" fill="#3fb950" font-size="14" font-weight="700">575</text>

    <!-- Longest Streak -->
    <text x="0" y="62" fill="#ffa657" font-size="12.5" font-weight="700">Longest Streak</text>
    <text x="210" y="62" fill="#22d3ee" font-size="13" font-weight="700">21 days</text>

    <!-- Current Streak -->
    <text x="0" y="92" fill="#ffa657" font-size="12.5" font-weight="700">Current Streak</text>
    <text x="210" y="92" fill="#3fb950" font-size="13" font-weight="700">21 days</text>
  </g>

  <!-- Divider Line -->
  <line x1="380" y1="52" x2="380" y2="180" stroke="#30363d" stroke-dasharray="4,4" />

  <!-- Tech Stack Share (Right Column) -->
  <g transform="translate(410, 60)">
    <text x="0" y="0" fill="#58a6ff" font-size="13" font-weight="700">&#8212; CORE STACK SHARE</text>

    <!-- Java 45% -->
    <text x="0" y="32" fill="#c9d1d9" font-size="12.5" font-weight="700">Java</text>
    <text x="75" y="32" fill="#8b949e" font-size="12">[==================                  ]</text>
    <text x="375" y="32" fill="#c9d1d9" font-size="12.5" font-weight="700">45%</text>

    <!-- React 35% -->
    <text x="0" y="62" fill="#c9d1d9" font-size="12.5" font-weight="700">React</text>
    <text x="75" y="62" fill="#8b949e" font-size="12">[==============                      ]</text>
    <text x="375" y="62" fill="#c9d1d9" font-size="12.5" font-weight="700">35%</text>

    <!-- C++ 20% -->
    <text x="0" y="92" fill="#c9d1d9" font-size="12.5" font-weight="700">C++</text>
    <text x="75" y="92" fill="#8b949e" font-size="12">[========                            ]</text>
    <text x="375" y="92" fill="#c9d1d9" font-size="12.5" font-weight="700">20%</text>
  </g>

  <!-- Clean Footer Bar -->
  <line x1="0" y1="208" x2="860" y2="208" stroke="#30363d" stroke-width="1" />
  <text x="30" y="228" fill="#3fb950" font-size="12">&#9679; Status: Building &amp; Shipping</text>
  <text x="830" y="228" fill="#8b949e" font-size="12" text-anchor="end">Auto-Refreshed Daily</text>
</svg>
