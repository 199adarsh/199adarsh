name: Update profile art

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/make_info_card.py
      - run: python scripts/make_ascii_svg.py
      - run: python scripts/make_stats_card.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art & contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg info-card.svg adarsh-ascii.svg stats-card.svg"
